<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SQMC (Standart Quality Mutu Controller) — penentu standar mutu, toleransi, batas cacat, dan peta kendali Shewhart untuk industri manufaktur.">
<meta name="theme-color" content="#0f3b66">
<title>SQMC — Standart Quality Mutu Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#132231; --ink2:#4a5b6c; --ink3:#7b8a99;
  --line:#dde3ea; --line2:#eef1f5;
  --pri:#0f3b66; --pri2:#1d5c99; --pri-soft:#e6eef7;
  --acc:#0e8a7a; --acc-soft:#e3f4f1;
  --ok:#2e7d32; --ok-soft:#e8f5e9;
  --warn:#a86200; --warn-soft:#fff4e0;
  --bad:#c62828; --bad-soft:#fdecec;
  --radius:10px; --shadow:0 1px 2px rgba(16,32,48,.06),0 4px 14px rgba(16,32,48,.05);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--pri2)}
h1,h2,h3,h4{margin:0;line-height:1.25}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
h4{font-size:.92rem;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
p{margin:.35rem 0}
small,.muted{color:var(--ink3)}
.mono{font-family:var(--mono)}
/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;flex-shrink:0}
.brand-name{font-weight:700;font-size:1.25rem;letter-spacing:.06em}
.brand-sub{display:block;font-size:.66rem;font-weight:400;opacity:.8;letter-spacing:.02em;margin-top:-2px}
.storage-badge{margin-left:auto;font-size:.72rem;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.nav{background:#0b2f52;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-in{max-width:1280px;margin:0 auto;display:flex;gap:2px;padding:0 10px}
.nav a{color:#c9d8e8;text-decoration:none;padding:10px 14px;font-size:.88rem;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px}
.nav a:hover{color:#fff}
.nav a.active{color:#fff;border-bottom-color:#4fc3b4}
.nav svg{width:16px;height:16px;opacity:.9}
main{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.page-head p{color:var(--ink2);max-width:780px}
/* ---------- components ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}main{padding:14px 10px 60px}.card{padding:14px}.brand-sub{display:none}}
label.f{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:4px}
.field{margin-bottom:12px}
.hint{font-size:.76rem;color:var(--ink3);margin-top:3px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;font-size:.9rem;color:var(--ink);background:#fff;border:1px solid #cdd5de;border-radius:7px;padding:7px 9px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(29,92,153,.14)}
textarea{min-height:90px;font-family:var(--mono);font-size:.82rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1;min-width:120px}
.chk{display:flex;align-items:center;gap:7px;font-size:.87rem;padding:4px 0;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--pri2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #cdd5de;border-radius:99px;padding:5px 11px;font-size:.82rem;cursor:pointer;background:#fff;user-select:none}
.chip input{display:none}
.chip.on{background:var(--pri-soft);border-color:var(--pri2);color:var(--pri);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-size:.86rem;font-weight:600;border-radius:7px;border:1px solid transparent;padding:8px 14px;cursor:pointer;background:var(--pri);color:#fff;transition:background .15s,transform .05s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--pri2)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--pri);border-color:#c3cfdc}
.btn.sec:hover{background:var(--pri-soft)}
.btn.acc{background:var(--acc)}
.btn.acc:hover{background:#0b7466}
.btn.danger{background:#fff;color:var(--bad);border-color:#efc4c4}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{font:inherit;font-size:.86rem;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri2);font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t th{background:#f2f5f9;text-align:left;font-weight:600;color:var(--ink2);padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:hover td{background:#fafbfd}
table.t td.num,table.t th.num{text-align:right;font-family:var(--mono);font-size:.8rem}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tw table.t th:first-child,.tw table.t td:first-child{padding-left:11px}
.badge{display:inline-block;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.b-iso{background:#e5eefb;color:#174a8b}.b-sni{background:#fde9e9;color:#a02222}.b-asme{background:#efe8fb;color:#5b2f9e}.b-en{background:#e7f5f0;color:#0d6b55}.b-astm{background:#fdf1e1;color:#8a5200}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--pri-soft);color:var(--pri)}.b-gray{background:#eef1f4;color:#5b6b7b}
.alert{border-radius:8px;padding:10px 12px;font-size:.86rem;margin:8px 0;border:1px solid}
.alert.warn{background:var(--warn-soft);border-color:#f3d39b;color:#6b4000}
.alert.bad{background:var(--bad-soft);border-color:#f2bcbc;color:#7d1717}
.alert.ok{background:var(--ok-soft);border-color:#b9dfbb;color:#1d5420}
.alert.info{background:var(--pri-soft);border-color:#c6d8ee;color:#123e6b}
.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.kpi .k{font-size:.74rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .v{font-size:1.45rem;font-weight:700;font-family:var(--mono);margin-top:2px}
.kpi .s{font-size:.76rem;color:var(--ink2)}
.empty{text-align:center;padding:30px 14px;color:var(--ink3);border:1.5px dashed var(--line);border-radius:10px}
.drop{border:2px dashed #b9c7d6;border-radius:10px;padding:22px;text-align:center;color:var(--ink2);background:#fafcfe;cursor:pointer;transition:background .15s,border .15s}
.drop.over{background:var(--pri-soft);border-color:var(--pri2)}
.sec-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.sec-title .n{width:24px;height:24px;border-radius:6px;background:var(--pri);color:#fff;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.disp-accept{color:var(--ok);font-weight:600}.disp-rework{color:var(--warn);font-weight:600}.disp-reject{color:var(--bad);font-weight:600}
.chart-box{width:100%;min-height:420px}
.hero{background:linear-gradient(135deg,#0f3b66 0%,#155389 60%,#0e8a7a 140%);color:#fff;border-radius:14px;padding:26px 24px;margin-bottom:16px;position:relative;overflow:hidden}
.hero h1{font-size:1.7rem;letter-spacing:.04em}
.hero .sub{opacity:.85;font-size:.9rem}
.hero p{max-width:700px;opacity:.92}
.hero .row{margin-top:14px}
.hero .btn.sec{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.hero .btn.sec:hover{background:rgba(255,255,255,.22)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:760px){.flow{grid-template-columns:1fr 1fr}}
.flow .st{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px}
.flow .st b{display:block;color:var(--pri);font-size:.95rem}
.flow .st span{font-size:.8rem;color:var(--ink2)}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#132231;color:#fff;padding:9px 16px;border-radius:8px;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:auto;max-width:92vw}
.toast.err{background:#8e1c1c}.toast.ok{background:#1f5f24}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal .row{justify-content:flex-end;margin-top:14px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff;flex-wrap:wrap}
.list-item .meta{font-size:.78rem;color:var(--ink3)}
.grid-edit td{padding:3px 4px!important}
.grid-edit input{padding:5px 6px;font-size:.82rem;min-width:70px}
.grid-edit input.v{font-family:var(--mono);text-align:right;min-width:74px}
.foot{font-size:.76rem;color:var(--ink3);text-align:center;padding:20px 10px;border-top:1px solid var(--line);margin-top:20px}
.pill-step{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;background:var(--acc-soft);color:var(--acc);padding:3px 10px;border-radius:99px;font-weight:600}
details.acc{border:1px solid var(--line);border-radius:9px;padding:0 12px;margin-bottom:8px;background:#fff}
details.acc summary{cursor:pointer;padding:11px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary{border-bottom:1px solid var(--line2);margin-bottom:8px}
.formula{font-family:var(--mono);font-size:.82rem;background:#f5f7fa;border:1px solid var(--line);border-radius:7px;padding:9px 11px;overflow-x:auto;white-space:pre}
.hidden{display:none!important}
.capgrid{grid-template-columns:1fr 1fr 1.6fr}
@media(max-width:760px){.capgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#beranda" aria-label="SQMC beranda">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="9" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".35"/>
        <path d="M7 27 L13 21 L18 24 L24 13 L29 18 L33 10" fill="none" stroke="#4fc3b4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="6" y1="9" x2="34" y2="9" stroke="#ff8a80" stroke-width="1.4" stroke-dasharray="2 2"/>
        <line x1="6" y1="31" x2="34" y2="31" stroke="#ff8a80" stroke-width="1.4" stroke-dasharray="2 2"/>
        <line x1="6" y1="20" x2="34" y2="20" stroke="#a5d6a7" stroke-width="1.2"/>
      </svg>
      <span><span class="brand-name">SQMC</span><span class="brand-sub">(Standart Quality Mutu Controller)</span></span>

<main id="app"></main>
<div class="foot">SQMC v1.0 · Rekomendasi sistem bersifat pendukung keputusan dan wajib diverifikasi QA/QC terhadap dokumen standar resmi edisi terbaru.</div>
<div class="toast-wrap" id="toasts"></div>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<script>
'use strict';
/* =====================================================================
   SQMC — Standart Quality Mutu Controller
   Single-file app: knowledge base, spec engine, SPC engine, storage, UI.
   ===================================================================== */

/* ------------------------------ UTIL ------------------------------ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isNum = (x) => typeof x === 'number' && Number.isFinite(x);
const sum = (a) => a.reduce((s, v) => s + v, 0);
const avg = (a) => a.length ? sum(a) / a.length : NaN;
const sd = (a) => { if (a.length < 2) return NaN; const m = avg(a); return Math.sqrt(sum(a.map(v => (v - m) ** 2)) / (a.length - 1)); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function fmt(x, d = 4) {
  if (!isNum(x)) return '—';
  const ax = Math.abs(x);
  let dd = d;
  if (ax !== 0 && ax < 0.01) dd = Math.max(d, 6);
  return x.toLocaleString('id-ID', { maximumFractionDigits: dd, minimumFractionDigits: 0 });
}
function fmtFix(x, d = 3) { return isNum(x) ? x.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—'; }
function parseNum(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? v : NaN;
  if (v === null || v === undefined) return NaN;
  let s = String(v).trim().replace(/\s/g, '');
  if (!s) return NaN;
  const hasDot = s.includes('.'), hasComma = s.includes(',');
  if (hasDot && hasComma) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (hasComma) {
    s = s.replace(',', '.');
  }
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN;
  return parseFloat(s);
}
function numOrNull(v) { const n = parseNum(v); return Number.isFinite(n) ? n : null; }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function dateID(ts) { try { return new Date(ts).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }); } catch (e) { return ''; } }
function slug(s) { return String(s || 'sqmc').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'sqmc'; }
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 3200);
}
function dialog(title, bodyHTML, buttons = [{ label: 'OK', value: true }]) {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><div style="margin-top:8px">${bodyHTML}</div><div class="row">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    bg.addEventListener('click', e => {
      const b = e.target.closest('button[data-i]');
      if (b) { const v = buttons[+b.dataset.i].value; bg.remove(); resolve(typeof v === 'function' ? v(bg) : v); }
      else if (e.target === bg) { bg.remove(); resolve(null); }
    });
    document.body.appendChild(bg);
  });
}
const confirmDlg = (t, msg, okLabel = 'Ya, lanjutkan', cls = 'danger') => dialog(t, `<p>${esc(msg)}</p>`, [{ label: 'Batal', value: false, cls: 'sec' }, { label: okLabel, value: true, cls }]);

/* ---------- math: normal distribution, gamma ---------- */
function erf(x) {
  // Abramowitz & Stegun 7.1.26 refined with series for small |x|
  const s = Math.sign(x); x = Math.abs(x);
  if (x < 0.5) { // Maclaurin series, high precision near 0
    let t = x, r = x, n = 0;
    for (n = 1; n < 30; n++) { t *= -x * x / n; r += t / (2 * n + 1); }
    return s * 2 / Math.sqrt(Math.PI) * r;
  }
  // Complementary via continued fraction (Lentz) for accuracy in tails
  const erfcv = erfcCF(x);
  return s * (1 - erfcv);
}
function erfcCF(x) {
  // erfc(x) = exp(-x^2)/sqrt(pi) * 1/(x+ 1/2/(x+ 1/(x+ 3/2/(x+ ...))))
  let f, C, D, delta, a; const tiny = 1e-300;
  f = x; if (f === 0) f = tiny; C = f; D = 0;
  for (let i = 1; i < 300; i++) {
    a = i / 2; D = x + a * D; if (Math.abs(D) < tiny) D = tiny; C = x + a / C; if (Math.abs(C) < tiny) C = tiny;
    D = 1 / D; delta = C * D; f *= delta; if (Math.abs(delta - 1) < 1e-15) break;
  }
  return Math.exp(-x * x) / Math.sqrt(Math.PI) / f;
}
const Phi = (z) => 0.5 * (1 + erf(z / Math.SQRT2));
const normPdf = (x, m, s) => Math.exp(-0.5 * ((x - m) / s) ** 2) / (s * Math.sqrt(2 * Math.PI));
function lgamma(z) {
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lgamma(1 - z);
  z -= 1; let x = c[0]; for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
  const t = z + g + 0.5;
  return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
}

/* =====================================================================
   KNOWLEDGE BASE
   Catatan: judul & ruang lingkup ditulis ulang (parafrase) oleh SQMC.
   "year": null berarti edisi belum diverifikasi SQMC → cek katalog resmi.
   ===================================================================== */
const ISO_SEARCH = (q) => 'https://www.iso.org/search.html?q=' + encodeURIComponent(q);

/* ISO 2768-1 general tolerances, linear dimensions (± mm) */
const ISO2768 = {
  ranges: [[0.5, 3], [3, 6], [6, 30], [30, 120], [120, 400], [400, 1000], [1000, 2000], [2000, 4000]],
  f: [0.05, 0.05, 0.1, 0.15, 0.2, 0.3, 0.5, null],
  m: [0.1, 0.1, 0.2, 0.3, 0.5, 0.8, 1.2, 2],
  c: [0.2, 0.3, 0.5, 0.8, 1.2, 2, 3, 4],
  v: [null, 0.5, 1, 1.5, 2.5, 4, 6, 8]
};
function iso2768Tol(nominal, cls) {
  const n = Math.abs(nominal);
  if (!(n >= 0.5)) return null;
  for (let i = 0; i < ISO2768.ranges.length; i++) {
    const [a, b] = ISO2768.ranges[i];
    if ((i === 0 ? n >= a : n > a) && n <= b) return ISO2768[cls][i];
  }
  return null;
}

/* ---------- ISO 2859-1 single sampling, normal inspection ---------- */
const AQL = {
  letters: 'ABCDEFGHJKLMNPQR'.split(''),
  sizes: [2, 3, 5, 8, 13, 20, 32, 50, 80, 125, 200, 315, 500, 800, 1250, 2000],
  aqls: [0.010, 0.015, 0.025, 0.040, 0.065, 0.10, 0.15, 0.25, 0.40, 0.65, 1.0, 1.5, 2.5, 4.0, 6.5, 10],
  acre: { 14: [0, 1], 17: [1, 2], 18: [2, 3], 19: [3, 4], 20: [5, 6], 21: [7, 8], 22: [10, 11], 23: [14, 15], 24: [21, 22] },
  lot: [[2, 8], [9, 15], [16, 25], [26, 50], [51, 90], [91, 150], [151, 280], [281, 500], [501, 1200], [1201, 3200], [3201, 10000], [10001, 35000], [35001, 150000], [150001, 500000], [500001, Infinity]],
  // Tabel kode huruf ukuran sampel: kolom S-1, S-2, S-3, S-4, I, II, III
  code: [
    'AAAAAAB', 'AAAAABC', 'AABBBCD', 'ABBCCDE', 'BBCCCEF', 'BBCDDFG', 'BCDEEGH', 'BCDEFHJ',
    'CCEFGJK', 'CDEGHKL', 'CDFGJLM', 'CDFHKMN', 'DEGJLNP', 'DEGJMPQ', 'DEHKNQR'
  ],
  levels: ['S-1', 'S-2', 'S-3', 'S-4', 'I', 'II', 'III']
};
function aqlPlan(lotSize, level, aql) {
  const N = Math.round(lotSize);
  if (!(N >= 2)) return null;
  const li = AQL.lot.findIndex(([a, b]) => N >= a && N <= b);
  const lv = AQL.levels.indexOf(level); if (li < 0 || lv < 0) return null;
  const letter = AQL.code[li][lv];
  let j = AQL.letters.indexOf(letter);
  const i = AQL.aqls.findIndex(a => Math.abs(a - aql) < 1e-9); if (i < 0) return null;
  let k = i + j, guard = 0, arrow = '';
  while (!AQL.acre[k] && guard++ < 40) {
    if (k < 14 || k === 16) { j += (k < 14 ? 14 - k : 1); k = i + j; arrow = arrow || '↓'; }
    else if (k === 15) { if (j - 1 >= 0) { j -= 1; k = i + j; arrow = arrow || '↑'; } else { j += 2; k = i + j; arrow = arrow || '↓'; } }
    else if (k > 24) { j -= (k - 24); k = i + j; arrow = arrow || '↑'; }
    if (j > 15) { j = 15; k = i + j; if (!AQL.acre[k]) return null; }
  }
  const [ac, re] = AQL.acre[k];
  let n = AQL.sizes[j], full = false;
  if (n >= N) { n = N; full = true; }
  return { letter, planLetter: AQL.letters[j], n, ac, re, arrow, full };
}

function buildSpec(inp) {
  const mat = MATERIALS[inp.material] || MATERIALS.other;
  const fam = mat.fam;
  const stds = []; const seen = new Set();
  const addS = (k, reason) => { if (!STD[k] || seen.has(k)) return; seen.add(k); stds.push({ key: k, ...STD[k], reason }); };
  const W = []; // warnings {lvl, text}
  const fluids = inp.fluids || [], envs = inp.envs || [];
  const T = numOrNull(inp.tmax), PN = numOrNull(inp.pn);

  // --- product standards
  switch (inp.material) {
    case 'pvcu':
      if (fluids.includes('waste') && !fluids.some(f => ['potable', 'water'].includes(f)) && !(PN > 0)) addS('sni0178', 'Fitting PVC untuk air buangan/drainase.');
      else { addS('iso1452', 'Standar produk internasional fitting PVC-U bertekanan.'); if (fluids.includes('potable') || fluids.includes('water')) addS('sni0135', 'Produk untuk saluran air minum di Indonesia (skema SNI).'); if (fluids.includes('waste')) addS('sni0178', 'Juga dipakai untuk air buangan.'); }
      break;
    case 'pvcc': addS('iso15877', 'Standar produk fitting PVC-C air panas & dingin.'); addS('iso10508', 'Penentuan kelas aplikasi suhu.'); break;
    case 'pe100':
      if (fluids.includes('gas')) addS('iso4437', 'Fitting PE untuk gas memakai seri standar khusus gas.');
      if (fluids.some(f => f !== 'gas') || !fluids.length) { addS('iso4427', 'Standar produk fitting PE untuk air.'); addS('sni4829', 'Skema SNI fitting PE air minum (padanan ISO 4427-3:2019).'); }
      break;
    case 'ppr': addS('iso15874', 'Standar produk fitting PP-R/PP-RCT.'); addS('sni15874', 'Adopsi SNI untuk sertifikasi di Indonesia.'); addS('iso10508', 'Kelas aplikasi air panas.'); break;
    case 'pex': addS('iso15875', 'Standar produk fitting sistem PE-X.'); addS('iso10508', 'Kelas aplikasi air panas.'); break;

/* =====================================================================
   STORAGE (claude db → localStorage → memori)
   ===================================================================== */
const LS_KEY = 'sqmc.v1';
function lsGet() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function lsSet(v) { try { localStorage.setItem(LS_KEY, JSON.stringify(v)); return true; } catch (e) { return false; } }
const Store = {
  mode: 'memory', db: null, uid: null,
  data: { spec: [], dataset: [], draft: null },
  async init() {
    const l = lsGet();
    if (l) { this.data = Object.assign({ spec: [], dataset: [], draft: null }, l); this.mode = 'local'; }
    else if (lsSet(this.data)) this.mode = 'local';
    this.badge();
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    try {
      const [db, user] = await Promise.all([withTimeout(window.claude.use('db'), 10000).catch(() => null), withTimeout(window.claude.use('user'), 10000).catch(() => null)]);
      const id = user ? await user.id().catch(() => null) : null;
      if (!db || !id) return;
      const snap = await withTimeout(db.collection('data/users/' + id).get(), 10000);
      const remote = { spec: [], dataset: [] };
      snap.docs.forEach(d => { const v = d.data(); if (v && remote[v.kind] && v.payload) remote[v.kind].push(v.payload); });
      this.db = db; this.uid = id; this.mode = 'cloud';
      for (const kind of ['spec', 'dataset']) {
        const map = new Map(remote[kind].map(o => [o.id, o]));
        for (const o of this.data[kind]) { const r = map.get(o.id); if (!r || (o.updatedAt || 0) > (r.updatedAt || 0)) { map.set(o.id, o); await this._remote(kind, o).catch(() => { }); } }
        this.data[kind] = Array.from(map.values());
      }
      lsSet(this.data); this.badge(); App.refresh();
    } catch (e) { /* tetap lokal */ }
  },
  badge() {
    const t = { cloud: '☁ Tersimpan di akun Anda', local: '● Tersimpan di browser ini', memory: '○ Sementara (tidak tersimpan)' }[this.mode];
    const el = $('#storageBadge'); if (el) el.textContent = t;
  },
  docRef(kind, id) { return this.db.collection('data/users/' + this.uid).doc(kind + '_' + id); },
  async _remote(kind, obj) {
    const body = { kind, id: obj.id, updatedAt: obj.updatedAt || Date.now(), payload: obj };
    if (JSON.stringify(body).length > 250000) throw new Error('too_large');
    await this.docRef(kind, obj.id).set(body);
  },
  list(kind) { return (this.data[kind] || []).slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); },
  get(kind, id) { return (this.data[kind] || []).find(o => o.id === id) || null; },
  async put(kind, obj) {
    obj.updatedAt = Date.now();
    const arr = this.data[kind]; const i = arr.findIndex(o => o.id === obj.id);
    if (i >= 0) arr[i] = obj; else arr.push(obj);
    if (this.mode !== 'memory') lsSet(this.data);
    if (this.mode === 'cloud') {
      try { await this._remote(kind, obj); }
      catch (e) { toast(e && e.message === 'too_large' ? 'Data terlalu besar untuk disimpan di cloud (maks ±250 KB per item). Tersimpan lokal saja.' : 'Gagal sinkron ke cloud: ' + (e.code || e.message || e), 'err'); }
    }
  },
  async del(kind, id) {
    this.data[kind] = this.data[kind].filter(o => o.id !== id);
    if (this.mode !== 'memory') lsSet(this.data);
    if (this.mode === 'cloud') { try { await this.docRef(kind, id).delete(); } catch (e) { toast('Gagal menghapus di cloud', 'err'); } }
  },
  saveDraft(d) { this.data.draft = d; if (this.mode !== 'memory') lsSet(this.data); }
};

/* ---------- downloads (claude capability → fallback blob link) ---------- */
let DL = null, DLready = false;
async function initDownloads() {
  if (window.claude && typeof window.claude.use === 'function') { try { DL = await withTimeout(window.claude.use('downloads'), 10000); } catch (e) { DL = null; } }
  DLready = true;
}
async function saveFile(filename, data, mime) {
  if (DL) {
    try { await DL.save({ filename, data }); toast('File siap: ' + filename, 'ok'); return; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') { toast('Unduhan dibatalkan'); return; }
      if (c === 'rate_limited') { toast('Tunggu sebentar lalu coba lagi', 'err'); return; }
      if (!['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(c)) { toast('Gagal mengunduh: ' + ((e && e.message) || c), 'err'); return; }
    }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch (e) { toast('Browser ini menolak unduhan.', 'err'); }
}

   SPC ENGINE
   ===================================================================== */
const D2 = [NaN, NaN, 1.128379, 1.692569, 2.058751, 2.325929, 2.534413, 2.704357, 2.847201, 2.970026, 3.077505, 3.172873, 3.258455, 3.33598, 3.406763, 3.471827, 3.531983, 3.587884, 3.640064, 3.688963, 3.73495, 3.778336, 3.819385, 3.858323, 3.895348, 3.930629];
const D3 = [NaN, NaN, 0.852502, 0.888368, 0.879808, 0.864082, 0.84804, 0.833205, 0.819831, 0.807834, 0.797051, 0.787315, 0.778478, 0.770416, 0.763023, 0.756211, 0.749908, 0.744052, 0.738591, 0.733481, 0.728686, 0.724173, 0.719915, 0.715887, 0.712068, 0.708441];
const c4 = (n) => n < 2 ? NaN : Math.exp(lgamma(n / 2) - lgamma((n - 1) / 2)) * Math.sqrt(2 / (n - 1));
const consts = (n) => {
  const d2 = D2[n], d3 = D3[n], C4 = c4(n), r = Math.sqrt(n);
  return { n, d2, d3, c4: C4, A2: 3 / (d2 * r), D3: Math.max(0, 1 - 3 * d3 / d2), D4: 1 + 3 * d3 / d2, A3: 3 / (C4 * r), B3: Math.max(0, 1 - 3 * Math.sqrt(1 - C4 * C4) / C4), B4: 1 + 3 * Math.sqrt(1 - C4 * C4) / C4 };
};
const TESTS = {
  1: '1 titik > 3σ dari garis tengah',
  2: '9 titik berturut-turut pada sisi yang sama',
  3: '6 titik berturut-turut naik atau turun semua',
  4: '14 titik berturut-turut naik-turun bergantian',
  5: '2 dari 3 titik > 2σ (sisi sama)',
  6: '4 dari 5 titik > 1σ (sisi sama)',
  7: '15 titik berturut-turut dalam 1σ (kedua sisi)',
  8: '8 titik berturut-turut > 1σ (kedua sisi)'
};
function runTests(x, cl, sig, enabled) {
  const n = x.length, z = x.map((v, i) => (isNum(v) && isNum(sig[i]) && sig[i] > 0) ? (v - cl[i]) / sig[i] : NaN);
  const flags = x.map(() => []);
  const on = new Set(enabled);
  const okIdx = (i) => isNum(z[i]);
  for (let i = 0; i < n; i++) {
    if (!okIdx(i)) continue;
    if (on.has(1) && Math.abs(z[i]) > 3) flags[i].push(1);
    const win = (k) => { if (i - k + 1 < 0) return null; const w = []; for (let j = i - k + 1; j <= i; j++) { if (!okIdx(j)) return null; w.push(j); } return w; };
    if (on.has(2)) { const w = win(9); if (w && (w.every(j => z[j] > 0) || w.every(j => z[j] < 0))) flags[i].push(2); }
    if (on.has(3)) { const w = win(6); if (w) { let up = true, dn = true; for (let t = 1; t < 6; t++) { if (!(x[w[t]] > x[w[t - 1]])) up = false; if (!(x[w[t]] < x[w[t - 1]])) dn = false; } if (up || dn) flags[i].push(3); } }
    if (on.has(4)) { const w = win(14); if (w) { let ok = true; for (let t = 2; t < 14; t++) { const a = x[w[t - 1]] - x[w[t - 2]], b = x[w[t]] - x[w[t - 1]]; if (!(a * b < 0)) { ok = false; break; } } if (ok && (x[w[1]] - x[w[0]]) !== 0) flags[i].push(4); } }
    if (on.has(5)) { const w = win(3); if (w) { const up = w.filter(j => z[j] > 2).length, dn = w.filter(j => z[j] < -2).length; if ((z[i] > 2 && up >= 2) || (z[i] < -2 && dn >= 2)) flags[i].push(5); } }
    if (on.has(6)) { const w = win(5); if (w) { const up = w.filter(j => z[j] > 1).length, dn = w.filter(j => z[j] < -1).length; if ((z[i] > 1 && up >= 4) || (z[i] < -1 && dn >= 4)) flags[i].push(6); } }
    if (on.has(7)) { const w = win(15); if (w && w.every(j => Math.abs(z[j]) < 1)) flags[i].push(7); }
    if (on.has(8)) { const w = win(8); if (w && w.every(j => Math.abs(z[j]) > 1)) flags[i].push(8); }
  }
  return flags;
}

/** groups: array of arrays (variabel). opts: {type, exclude:Set(1-based), histMean, histSigma, tests} */
function computeVariable(groupsIn, opts) {
  const notes = [];
  let groups = groupsIn.map(g => g.filter(isNum));
  const nonEmpty = groups.filter(g => g.length > 0);
  if (nonEmpty.length < 2) throw new Error('Data terlalu sedikit (minimal 2 subgrup/observasi berisi angka).');
  const sizes = groups.map(g => g.length);
  const maxN = Math.max(...sizes);
  let type = opts.type || 'auto';
  if (type === 'auto') type = maxN <= 1 ? 'imr' : (maxN <= 8 ? 'xbarr' : 'xbars');
  if (type === 'imr' && maxN > 1) { groups = [].concat(...groups).map(v => [v]); notes.push('Data subgrup diratakan menjadi observasi individual untuk peta I-MR.'); }
  if (type === 'xbarr' && maxN > 25) { type = 'xbars'; notes.push('Ukuran subgrup > 25: otomatis memakai X̄-S.'); }
  const ex = opts.exclude || new Set();
  const k = groups.length;
  const inc = (i) => !ex.has(i + 1);
  if (type === 'imr') {
    const v = groups.map(g => g.length ? g[0] : NaN);
    const incV = v.filter((x, i) => isNum(x) && inc(i));
    if (incV.length < 2) throw new Error('Observasi tersisa setelah pengecualian terlalu sedikit.');
    const mr = v.map((x, i) => i === 0 ? NaN : (isNum(x) && isNum(v[i - 1]) ? Math.abs(x - v[i - 1]) : NaN));
    const mrInc = mr.filter((m, i) => isNum(m) && inc(i) && inc(i - 1));
    const mean = isNum(opts.histMean) ? opts.histMean : avg(incV);
    const MRbar = avg(mrInc);
    const sigma = isNum(opts.histSigma) ? opts.histSigma : MRbar / D2[2];
    if (!(sigma > 0)) throw new Error('Variasi nol — semua nilai sama; batas kendali tidak dapat dihitung.');
    const all = (val) => v.map(() => val);
    const main = { label: 'Nilai Individual', sym: 'X̄', points: v, cl: all(mean), ucl: all(mean + 3 * sigma), lcl: all(mean - 3 * sigma), sig: all(sigma) };

  const I = rows.map((r, i) => i).filter(i => inc[i]);

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function sampleVariable() {
  const r = rng(20261122), rows = [];
  const start = new Date('2026-11-01');
  for (let i = 0; i < 25; i++) {
    const shift = i >= 18 ? 0.42 : 0; const vals = [];
    for (let j = 0; j < 5; j++) vals.push(+(38.5 + shift + 0.26 * gauss(r)).toFixed(2));
    if (i === 9) vals[2] = +(vals[2] + 1.35).toFixed(2);
    const d = new Date(start.getTime() + i * 86400000);
    rows.push({ date: d.toISOString().slice(0, 10), shift: i % 2 ? '2' : '1', operator: ['Andi', 'Budi', 'Citra'][i % 3], machine: 'INJ-03', vals, note: '' });
  }

}
function sampleAttribute() {
  const r = rng(77), rows = []; const start = new Date('2026-11-01');
  for (let i = 0; i < 25; i++) {
    const n = 200; let p = 0.03; if (i === 14) p = 0.085;
    let d = 0; for (let j = 0; j < n; j++) if (r() < p) d++;

}

async function dispositionDialog(r) {

      $('#dd_res').innerHTML = `<div class="alert ${cls}">${txt}</div><div class="hint">Kelas: ${d.cls} · Batas: ${esc(d.limit)}</div>`;

function datasetToCSV(ds) {
  const q = (v) => { const s = String(v ?? ''); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  if (ds.kind === 'variable') {
    const n = ds.n || 1;
    const head = ['subgrup', 'tanggal', 'shift', 'operator', 'mesin', ...Array.from({ length: n }, (_, i) => 'x' + (i + 1)), 'catatan'];
    return [head.join(','), ...ds.rows.map((r, i) => [i + 1, r.date, r.shift, r.operator, r.machine, ...Array.from({ length: n }, (_, j) => isNum((r.vals || [])[j]) ? r.vals[j] : ''), r.note].map(q).join(','))].join('\n');
  }
  return ['sampel,tanggal,diperiksa,cacat,catatan', ...ds.rows.map((r, i) => [i + 1, r.date, r.inspected ?? '', r.defects ?? '', r.note].map(q).join(','))].join('\n');
}

    traces.push({ x, y: p.points.map(v => isNum(v) ? v : null), yaxis, type: 'scatter', mode: 'lines+markers', line: { color: '#1f4e9c', width: 1.3 }, marker: { color: '#1f4e9c', size: 6 }, hovertext: hover, hoverinfo: 'text', name, showlegend: false, connectgaps: false });
    const fx = [], fy = [], ft = [];
    p.flags.forEach((f, i) => { if (f.length && isNum(p.points[i])) { fx.push(i + 1); fy.push(p.points[i]); ft.push(f.join(',')); } });
    if (fx.length) traces.push({ x: fx, y: fy, yaxis, type: 'scatter', mode: 'markers+text', marker: { color: '#d32f2f', size: 9, symbol: 'square' }, text: ft, textposition: 'top center', textfont: { color: '#d32f2f', size: 11 }, hoverinfo: 'skip', showlegend: false });
    const step = (arr) => { const xs = [], ys = []; arr.forEach((v, i) => { xs.push(i + 0.5, i + 1.5); ys.push(v, v); }); return { xs, ys }; };
    [['ucl', '#d32f2f', 'UCL'], ['lcl', '#d32f2f', 'LCL'], ['cl', '#2e7d32', p.sym]].forEach(([key, col, lab]) => {
      const s = step(p[key]);
      traces.push({ x: s.xs, y: s.ys.map(v => isNum(v) ? v : null), yaxis, type: 'scatter', mode: 'lines', line: { color: col, width: key === 'cl' ? 1.4 : 1.2, shape: 'linear' }, hoverinfo: 'skip', showlegend: false, connectgaps: false });
      const lastV = [...p[key]].reverse().find(isNum);

    margin: { l: 62, r: narrow ? 84 : 110, t: 46, b: 46 }, height: res.disp ? 560 : 380, hovermode: 'closest',
    xaxis: { anchor: res.disp ? 'y2' : 'y', range: [0.5, k + 0.5], showgrid: false, zeroline: false, title: { text: res.xLabel }, tickmode: 'auto', nticks: Math.min(k, narrow ? 8 : 16), linecolor: '#9aa7b4', mirror: true, ticks: 'outside' },
    yaxis: { domain: res.disp ? [0.55, 1] : [0, 1], title: { text: res.main.label + (res.kind === 'variable' ? unit : '') }, showgrid: false, zeroline: false, linecolor: '#9aa7b4', mirror: true, ticks: 'outside' },
    annotations: ann
  };

  if (res.disp) traces.forEach(t => { t.xaxis = 'x'; });

    <li>Dokumen standar resmi harus dibeli dari ISO, BSN, ASME, ASTM, atau CEN/badan nasional.</li></ul></details>`;

function pdfReady() { if (!(window.jspdf && window.jspdf.jsPDF)) { toast('Pustaka PDF gagal dimuat. Periksa koneksi internet.', 'err'); return false; } return true; }

// jsPDF core fonts hanya mendukung WinAnsi: ganti simbol yang tidak tersedia
function pdfTxt(s) {

    .replace(/[⛔⚠ℹ☁●○✕]/g, '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, '...').replace(/₂/g, '2').replace(/₃/g, '3').replace(/₄/g, '4').replace(/[^\x00-\xFF]/g, '');

function pdfHeader(doc, title, sub) {

  doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.text('(Standart Quality Mutu Controller)', 31, 12.5);
  doc.setFontSize(8); doc.text(pdfTxt(new Date().toLocaleString('id-ID')), W - 12, 12.5, { align: 'right' });
  doc.setTextColor(19, 34, 49); doc.setFont('helvetica', 'bold'); doc.setFontSize(13.5); doc.text(pdfTxt(title), 12, 30);
  if (sub) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(74, 91, 108); doc.text(doc.splitTextToSize(pdfTxt(sub), W - 24), 12, 36); }
  return sub ? 42 : 36;
}
function pdfFooter(doc, note) {
  const n = doc.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(123, 138, 153);
    doc.text(doc.splitTextToSize(pdfTxt(note || 'Dokumen dihasilkan SQMC. Rekomendasi wajib diverifikasi QA/QC terhadap dokumen standar resmi edisi terbaru.'), W - 50), 12, H - 8);

}
const AT = (doc, y, head, body, extra = {}) => { doc.autoTable(Object.assign({ startY: y, head: [head.map(pdfTxt)], body: body.map(r => r.map(c => pdfTxt(c))), theme: 'grid', styles: { fontSize: 7.8, cellPadding: 1.6, lineColor: [221, 227, 234], lineWidth: 0.2, textColor: [19, 34, 49], overflow: 'linebreak' }, headStyles: { fillColor: [230, 238, 247], textColor: [15, 59, 102], fontStyle: 'bold' }, margin: { left: 12, right: 12 } }, extra)); return doc.lastAutoTable.finalY + 6; };
function secTitle(doc, y, t) { const H = doc.internal.pageSize.getHeight(); if (y > H - 30) { doc.addPage(); y = 16; } doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(15, 59, 102); doc.text(pdfTxt(t), 12, y); return y + 3; }

async function pdfSPC(res) {

  try {
    const img = await Plotly.toImage($('#chartMain'), { format: 'png', width: 1500, height: res.disp ? 780 : 480, scale: 1 });
    const h = (W - 24) * (res.disp ? 780 / 1500 : 480 / 1500); doc.addImage(img, 'PNG', 12, y, W - 24, h); y += h + 4;
  } catch (e) { }

  y = secTitle(doc, y, 'Interpretasi');
  y = AT(doc, y, ['Status', 'Keterangan'], interpret(res).map(x => [{ ok: 'OK', bad: 'KRITIS', warn: 'PERHATIAN', info: 'INFO' }[x.c], x.t.replace(/<[^>]+>/g, '')]), { columnStyles: { 0: { cellWidth: 24, fontStyle: 'bold' } } });
  const v = violationList(res.main, res.labels).map(x => [res.mainName, x.i, x.label, fmt(x.val, 5), x.tests.map(t => 'Tes ' + t + ': ' + TESTS[t]).join('; ')]);
